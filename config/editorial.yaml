# 日报精选目标为 10 条；每条至少满足一个质量条件，候选不足时说明原因。
curation:
  minPicks: 10
  maxPicks: 10
  selectionCriteria:
    - 有切实影响并且影响力大、影响程度深、影响范围广
    - 内容非常优质、非常值得阅读
    - 属于某领域的重大进展
    - 非常奇怪，超出常规认知
  interests: >-
    面向世界的综合日报，平等审视经济与实体产业、社会与公共事务、科学与医疗、环境与能源、文化历史与思想、AI与互联网技术。
    优先有广泛切实影响的变化、原始信息、扎实分析和可复用知识；不默认将模型更新、厂商活动或融资等同于重大进展。
  editorialPolicy:
    - 先按文章事实划分实质领域，再评估质量；不按来源名称或现有topic标签判断领域。科技公司融资仍属于科技产业，AI监管仍计入AI与互联网集中度。
    - 日常10条精选中，AI与互联网合计通常不超过4条；有合格候选时优先覆盖至少4类实质领域。自然科学、医疗、能源、制造等不因标为技术而自动算作互联网。
    - 优先为经济与实体产业、社会公共事务、科学医疗环境、文化历史思想分别寻找合格候选。若确无合格候选，不以促销、行情碎片、八卦或证据不足内容凑配额，可少选并说明缺口。
    - 同一媒体或同一机构通常最多2条，同一具体事件仅精选一次；机构官方公告是其自述，榜单、跑分与营销主张不能单凭发布者声称即视为重大进展，优先独立证据与实际影响。
    - 重大事件可突破集中度或来源软上限，但须在相关reason说明实际影响与为何例外；发布前检查领域分布，不得通过改topic标签规避。通常无需在新闻事实综述中插入配额解释。
