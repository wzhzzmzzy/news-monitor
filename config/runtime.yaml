# 采集、摘要预算；个人覆盖请写入主配置。
collection:
  rssConcurrency: 4
  rssTimeoutMs: 20000
  # rssProxyUrl: http://127.0.0.1:7897 # 可选本机覆盖；默认读取 HTTP(S)_PROXY，遵循 NO_PROXY
  rssRetries: 1
  retryDelayMs: 500
  userAgent: news-monitor/1.0 (personal RSS reader)
  xMaxItems: 1000
opencli:
  enabled: true
  timeoutMs: 120000
  maxBufferBytes: 10485760
localization:
  enabled: true
  mode: summary
  summaryChunkChars: 24000
  chunkChars: 3000
  concurrency: 2
  blogBatchSize: 20
